<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hephaestus</title>
    <meta name="description" content="A simple gym log for you and your friends." />
    <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hephaestus" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
    />
    <style>
      /* Loading screen, inlined so it paints before any script or stylesheet loads */
      html, body { margin: 0; background: #eef1f5; }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #eef1f5;
        color: #15191f;
        font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
        font-weight: 700;
        font-size: clamp(36px, 11vw, 64px);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        html, body, .splash { background: #0f1217; color: #e8ebf0; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status" aria-label="Loading Hephaestus">Hephaestus</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
